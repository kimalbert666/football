name: Four Team Cloud Monitor

on:
  schedule:
    # Avoid the top of the hour, where scheduled Actions are more likely to queue.
    - cron: "17,47 * * * *"
    # Daily result settlement at 07:23 Asia/Hong_Kong (23:23 UTC).
    - cron: "23 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: four-team-cloud-monitor
  cancel-in-progress: false

jobs:
  prematch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17,47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: python -m pip install -r engine/requirements.txt

      - name: Refresh matches and odds
        run: |
          mkdir -p .github/run-logs
          python -u engine/scripts/sporttery_fetch.py | tee .github/run-logs/sporttery.log

      - name: Check whether a tracked match is due
        id: check
        run: python -u engine/scripts/four_team_monitor.py check

      - name: Capture f2 forecasts
        if: steps.check.outputs.notify == 'true'
        run: |
          python -u engine/scripts/f2_fusion.py snapshot premier_league
          python -u engine/scripts/f2_fusion.py snapshot champions_league

      - name: Fetch match intelligence
        if: steps.check.outputs.notify == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          rows = json.load(open('.github/run-logs/four-team-context.json', encoding='utf-8')).get('matches', [])
          for row in rows:
              if row.get('matchId'):
                  subprocess.run([sys.executable, 'engine/scripts/sporttery_fetch.py', 'insight', str(row['matchId'])], check=False)
          PY

      - name: Generate deterministic f3 card
        if: steps.check.outputs.notify == 'true'
        shell: bash
        run: |
          python -u engine/scripts/boldplay.py
          test -f "data/03-predictions/$(date -u +%F)-boldplay.json"

      - name: Build tracked-team report
        if: steps.check.outputs.notify == 'true'
        id: report
        run: python -u engine/scripts/four_team_monitor.py report

      - name: Publish GitHub notification
        if: steps.check.outputs.notify == 'true'
        shell: bash
        env:
          ISSUE_TITLE: ${{ steps.report.outputs.issue_title }}
          REPORT_PATH: ${{ steps.report.outputs.report }}
        run: |
          issue=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$REPORT_PATH"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$REPORT_PATH" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Commit audit artifacts
        if: steps.check.outputs.notify == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/04-summaries/four-team-latest.md data/05-trends engine/cache/four_team_monitor_state.json engine/cache/f2_fusion.json engine/cache/sporttery_matches.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(monitor): update four-team review"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-team-monitor-${{ github.run_number }}
          path: .github/run-logs/
          if-no-files-found: ignore
          retention-days: 14

  settle:
    if: github.event.schedule == '23 23 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - run: python -m pip install -r engine/requirements.txt

      - name: Backfill results and recalibrate
        run: python -u engine/scripts/run.py verify

      - name: Commit settlement artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data engine/cache
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(monitor): settle four-team results"
          git pull --rebase origin main
          git push origin HEAD:main
