name: F4 Browser Opening Source Probe

on:
  workflow_dispatch:
    inputs:
      command:
        description: One-shot read-only browser connectivity diagnostic
        required: false
        default: probe
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ordinary Chromium runtime
        timeout-minutes: 4
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Read two fixed public pages once
        timeout-minutes: 3
        run: python3 .github/scripts/titan_browser_probe.py --output titan-browser-probe.json
      - name: Preserve limited diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-browser-probe-${{ github.run_id }}
          path: titan-browser-probe.json
          if-no-files-found: warn
          retention-days: 14
