name: F4 Repair Acceptance
on:
  workflow_dispatch:
    inputs:
      command:
        type: string
        default: test
permissions:
  contents: read
concurrency:
  group: f4-isolated-repair-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: python -m pip install -r engine/requirements.txt
      - name: Verify complete f4 suite including real temporary Git persistence
        run: python -m pytest engine/tests/test_f4*.py -q --junitxml=f4-repair-tests.xml
      - name: Confirm tests did not alter tracked records
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-repair-acceptance
          path: f4-repair-tests.xml
          retention-days: 14
