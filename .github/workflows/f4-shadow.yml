name: F4 Shadow Monitor

on:
  schedule:
    # Hourly discovery; the bounded worker waits for exact capture windows.
    # Reduce empty fork runs; runner availability and handoffs still matter.
    - cron: '7 * * * *'
    # 07:43 Hong Kong: outcomes and fixture coverage, without training.
    - cron: '43 23 * * *'
    # First day 10:13 Hong Kong: previous month research report.
    - cron: '13 2 1 * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'F4 parallel observation task'
        required: true
        default: all
        type: choice
        options: [all, capture, watch, daily, review, monthly]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: f4-shadow-monitor
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TZ: UTC
      GH_TOKEN: ${{ github.token }}
      F4_COMMAND: ${{ inputs.command || (github.event.schedule == '43 23 * * *' && 'daily') || (github.event.schedule == '13 2 1 * *' && 'monthly') || 'capture' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Verify f4 on manual acceptance runs
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest engine/tests/test_f4*.py -q
      - name: Record or evaluate f4 observations
        id: observe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/run-logs
          if [ "$F4_COMMAND" = capture ] || [ "$F4_COMMAND" = watch ]; then
            python -u engine/scripts/f4_watch.py 2>&1 | tee .github/run-logs/f4.log
          else
            python -u engine/scripts/f4_cloud.py "$F4_COMMAND" 2>&1 | tee .github/run-logs/f4.log
          fi
      - name: Publish meaningful f4 update
        if: steps.observe.outputs.notify == 'true'
        run: python engine/scripts/f4_publish.py
      - name: Save f4 records
        if: always() && steps.observe.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/f4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(f4): save forward observations and score review'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not persist f4 records after three attempts.' >&2
          exit 1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/run-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Propagate observation failures
        if: always() && steps.observe.outcome == 'failure'
        run: exit 1
