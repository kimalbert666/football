name: F4 Browser Opening Batch Acceptance

on:
  workflow_dispatch:
    inputs:
      command:
        description: Bounded read-only cross-fixture acceptance
        required: false
        default: probe
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline identity and archive checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_titan_*.py'
      - name: Install ordinary Chromium runtime
        timeout-minutes: 4
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Read explicit public fixture pages
        timeout-minutes: 9
        run: python3 .github/scripts/titan_batch_reader.py --targets .github/scripts/batch-targets.json --output titan-browser-probe.json
      - name: Preserve structured historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-browser-probe-${{ github.run_id }}
          path: titan-browser-probe.json
          if-no-files-found: warn
          retention-days: 14
