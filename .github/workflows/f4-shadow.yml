name: F4 Opening Source Probe

on:
  workflow_dispatch:
    inputs:
      command:
        description: Read-only public opening-source diagnostic
        required: false
        default: probe
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe opening quote and history
        run: python3 .github/scripts/titan_opening_probe.py --transport curl-http1 --output titan-opening-probe.json
      - name: Preserve limited diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titan-opening-probe-${{ github.run_id }}
          path: titan-opening-probe.json
          if-no-files-found: error
          retention-days: 14
