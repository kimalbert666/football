name: Weekly Football Prediction

on:
  # Every Saturday at 08:00 Asia/Shanghai (00:00 UTC), before the main weekend slate.
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:
    inputs:
      method:
        description: "Prediction method"
        required: true
        default: "freq"
        type: choice
        options:
          - freq
          - amix

permissions:
  contents: write

concurrency:
  group: weekly-football-prediction
  cancel-in-progress: false

jobs:
  predict:
    name: Refresh data and generate weekly ticket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PREDICTION_METHOD: ${{ inputs.method || 'freq' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Refresh core data
        id: refresh
        shell: bash
        run: |
          set +e
          mkdir -p .github/run-logs
          timeout 900 python -u engine/scripts/run.py all 2>&1 | tee .github/run-logs/run-all.log
          rc=${PIPESTATUS[0]}
          echo "run_all_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "Core refresh failed; the prediction step may use the newest available local cache."
          fi
          exit 0

      - name: Refresh Sporttery five-pool odds
        id: odds
        shell: bash
        run: |
          set +e
          timeout 600 python -u engine/scripts/sporttery_fetch.py 2>&1 | tee .github/run-logs/sporttery-fetch.log
          rc=${PIPESTATUS[0]}
          echo "sporttery_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "Sporttery refresh failed; cached odds will be used if available."
          fi
          exit 0

      - name: Check cache freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-04 起检查对象=sporttery_matches.json（boldplay 主数据源，批次1 改实时清单；
          # score_odds 日存档仅为历史留档不再作数据源）
          latest_date=$(python3 -c "import json;print((json.load(open('engine/cache/sporttery_matches.json'))['fetchedAt'] or '')[:10])")
          echo "latest_live_fetch=$latest_date" >> "$GITHUB_OUTPUT"
          # 7 天阈值：周赛制允许跨周缓存，超过 7 天视为陈旧
          threshold=$(date -u -d '7 days ago' +%F 2>/dev/null || date -u -v-7d +%F)
          if [[ -z "$latest_date" || "$latest_date" < "$threshold" ]]; then
            echo "⚠ Stale cache: sporttery_matches fetchedAt=$latest_date (threshold=$threshold)"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Fresh cache: sporttery_matches fetchedAt=$latest_date"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate weekly prediction
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/cache/sporttery_matches.json   # boldplay 主数据源（实时在售清单）
          if [ "$PREDICTION_METHOD" = "amix" ]; then
            timeout 900 python -u engine/scripts/boldplay.py --method=amix | tee .github/run-logs/boldplay.log
          else
            timeout 900 python -u engine/scripts/boldplay.py | tee .github/run-logs/boldplay.log
          fi

      - name: Validate generated prediction
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find data/03-predictions -maxdepth 1 -name '*-boldplay.json' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$latest"
          test "$(basename "$latest")" = "$(date -u +%F)-boldplay.json"
          python - "$latest" "${{ steps.freshness.outputs.stale }}" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          stale = sys.argv[2] == "true"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("date"), "prediction date missing"
          assert "tiers" in d, "tiers missing"
          assert d.get("method") in {"freq", "amix"}, "unexpected method"
          # 缓存新鲜度：陈旧时注入标记（不阻断，但下游可读）
          if stale:
              d.setdefault("warnings", []).append(f"stale_live: sporttery_matches fetchedAt older than 7 days")
              p.write_text(json.dumps(d, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
              print(f"⚠ validated {p.name} with STALE cache warning")
          else:
              print(f"validated {p}: method={d['method']} totalCost={d.get('totalCost')}")
          PY

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout is clean; include refreshed tracked data and the new prediction.
          git add -u data engine/cache
          git add data/03-predictions
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(prediction): weekly football forecast $(date -u +%F)"
          git push origin HEAD:main

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-prediction-logs-${{ github.run_number }}
          path: .github/run-logs/
          if-no-files-found: ignore
          retention-days: 14
